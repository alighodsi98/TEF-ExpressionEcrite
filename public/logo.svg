<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 36" xml:space="preserve">
<defs>
  <style type="text/css">
    .tef { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: 1.5px; }
    .breathe { animation: breathe 2.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:.75} 50%{opacity:1} }
  </style>
</defs>

<!-- Rounded white background -->
<rect width="30" height="36" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.3"/>

<!-- Canada flag: left red bar -->
<rect x="0" y="0" width="7.5" height="27" fill="#FF0000"/>
<!-- Canada flag: right red bar -->
<rect x="22.5" y="0" width="7.5" height="27" fill="#FF0000"/>

<!-- Official maple leaf, scaled to fit the white band (x:7.5 to x=22.5, width=15) -->
<!-- Original viewBox: -1953 -2031 3906 4061, so leaf is ~3906 wide x ~4061 tall -->
<!-- Target: centered in 15px wide, ~18px tall area, at x=15, y~12 -->
<g class="breathe" transform="translate(15, 13.5) scale(0.0034)">
  <path fill="#FF0000" d="m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z"/>
</g>

<!-- Red bottom bar for TEF text -->
<rect x="0" y="27" width="30" height="9" fill="#FF0000" rx="0"/>
<text class="tef" x="15" y="33.8">TEF</text>
</svg>
